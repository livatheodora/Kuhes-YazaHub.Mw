<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marketplace — KUHeS Yaza</title>
<meta name="theme-color" content="#0a1f44">
<link rel="icon" href="kuhes.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* ── Page-specific overrides ── */
.page-topbar{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--navy-deep) 88%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
}
.back-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:var(--navy-card);color:var(--text);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.back-btn:hover{border-color:var(--gold);}
.page-title{font-family:var(--font-display);font-weight:700;font-size:1.05rem;flex:1;}
.page-title em{color:var(--gold);font-style:normal;}

.sell-fab{
  position:fixed;bottom:84px;right:18px;z-index:30;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));
  color:#20140a;border:none;border-radius:50px;
  padding:13px 20px;font-weight:700;font-size:.9rem;
  display:flex;align-items:center;gap:8px;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  transition:transform .15s ease,box-shadow .15s ease;
}
.sell-fab:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.45);}
.sell-fab svg{flex-shrink:0;}

/* Scrolling chip track */
.chip-track-wrap{
  overflow:hidden;margin-bottom:10px;-webkit-mask:linear-gradient(to right,transparent,black 8%,black 92%,transparent);
  mask:linear-gradient(to right,transparent,black 8%,black 92%,transparent);
}
.chip-track{
  display:flex;gap:8px;width:max-content;
  animation:slideChips 18s linear infinite;
}
.chip-track:hover{animation-play-state:paused;}
@keyframes slideChips{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}
.chip-track .chip{flex-shrink:0;}

.page-container{padding:14px 16px 100px;max-width:720px;margin:0 auto;}
#mpFeed .empty-state{grid-column:1/-1;text-align:center;padding:40px 20px;}

/* Market card cover ── full-bleed image or coloured cover */
.res-thumb img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block;}
</style>
</head>
<body data-theme="dark">

<div id="app">
  <!-- Top bar -->
  <header class="page-topbar">
    <button class="back-btn" id="backBtn" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <div class="page-title"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg> <em>Marketplace</em></div>
    <span id="mpCount" style="font-family:var(--font-mono);font-size:.8rem;color:var(--text-muted);"></span>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" style="margin-left:4px;">
      <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="page-container">

    <!-- Hero banner -->
    <div style="background:linear-gradient(135deg,#1a3a6b,#0e1f42);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px;position:relative;overflow:hidden;">
      <div style="font-size:2.2rem;position:absolute;right:18px;top:50%;transform:translateY(-50%);opacity:.15;"><svg class="ui-icon" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></div>
      <div style="font-family:var(--font-display);font-size:1.2rem;font-weight:800;color:var(--text);margin-bottom:4px;">Student Marketplace</div>
      <div style="font-size:.82rem;color:var(--text-muted);max-width:80%;">Buy & sell books, gear, scrubs and services within the KUHeS community. No fees. No middlemen.</div>
    </div>

    <!-- Search -->
    <div class="search-row" style="margin-bottom:12px;">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="mpSearch" placeholder="Search items, scrubs, textbooks…">
    </div>

    <!-- Category chips — continuously scrolling -->
    <div class="chip-track-wrap">
      <div class="chip-track" id="mpCatTrack">
        <!-- duplicated for seamless loop -->
        <button class="chip active" data-mcat="all">All</button>
        <button class="chip" data-mcat="Books"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2Z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7Z"/></svg> Books</button>
        <button class="chip" data-mcat="Electronics"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Electronics</button>
        <button class="chip" data-mcat="Uniform &amp; Scrubs"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 12 6l4-3 5 4-3 4-2-1.5V21H8V9.5L6 11 3 7Z"/></svg> Uniform &amp; Scrubs</button>
        <button class="chip" data-mcat="Room &amp; Living"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/><path d="M2 20v-3h20v3"/><path d="M2 14V9a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M14 11V9a2 2 0 0 1 2-2h2"/></svg> Room &amp; Living</button>
        <button class="chip" data-mcat="Services"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L2.6 19.4a1.4 1.4 0 0 0 2 2l7.5-6.5a4 4 0 0 0 5.6-5.6l-2.4 2.4-2-2Z"/></svg> Services</button>
        <button class="chip" data-mcat="Other"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg> Other</button>
        <!-- duplicate set for seamless loop -->
        <button class="chip" data-mcat="all">All</button>
        <button class="chip" data-mcat="Books"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2Z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7Z"/></svg> Books</button>
        <button class="chip" data-mcat="Electronics"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Electronics</button>
        <button class="chip" data-mcat="Uniform &amp; Scrubs"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 12 6l4-3 5 4-3 4-2-1.5V21H8V9.5L6 11 3 7Z"/></svg> Uniform &amp; Scrubs</button>
        <button class="chip" data-mcat="Room &amp; Living"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/><path d="M2 20v-3h20v3"/><path d="M2 14V9a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M14 11V9a2 2 0 0 1 2-2h2"/></svg> Room &amp; Living</button>
        <button class="chip" data-mcat="Services"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L2.6 19.4a1.4 1.4 0 0 0 2 2l7.5-6.5a4 4 0 0 0 5.6-5.6l-2.4 2.4-2-2Z"/></svg> Services</button>
        <button class="chip" data-mcat="Other"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg> Other</button>
      </div>
    </div>

    <!-- Grid -->
    <div id="mpFeed" class="grid">
      <div class="skeleton-row"><div class="skeleton-card"></div><div class="skeleton-card"></div></div>
    </div>

  </div>

  <!-- FAB -->
  <button class="sell-fab" id="sellFab">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    List an item
  </button>

  <!-- Marketplace listing modal (copied from index.html) -->
  <div class="modal-overlay hidden" id="marketModal">
    <div class="modal">
      <div class="modal-head"><h3>Sell an item</h3><button class="close-btn" data-close>&times;</button></div>
      <div class="modal-body">
        <div id="marketDropZone" class="drop-zone small">
          <p>Add a photo <span class="muted-text">(optional)</span></p>
          <input type="file" id="marketImageInput" accept="image/*" hidden>
          <img id="marketImgPreview" class="hidden" alt="preview">
        </div>
        <div class="field">
          <label>Item title</label>
          <input type="text" id="mTitle" placeholder="e.g. Snellen Chart, Grey's Anatomy 42nd Ed.">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Price (MWK)</label>
            <input type="number" id="mPrice" placeholder="e.g. 15000">
          </div>
          <div class="field">
            <label>Category</label>
            <select id="mCategory">
              <option>Books</option>
              <option>Electronics</option>
              <option>Uniform &amp; Scrubs</option>
              <option>Room &amp; Living</option>
              <option>Services</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Description</label>
          <input type="text" id="mDesc" placeholder="Condition, details, anything a buyer should know">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Your name</label>
            <input type="text" id="mSellerName" placeholder="e.g. Chisomo B.">
          </div>
          <div class="field">
            <label>WhatsApp / Phone</label>
            <input type="text" id="mSellerPhone" placeholder="e.g. 0999 123 456">
          </div>
        </div>
        <button id="marketPublishBtn" class="primary-btn">List Item</button>
      </div>
    </div>
  </div>

  <!-- Contact modal -->
  <div class="modal-overlay hidden" id="contactModal">
    <div class="modal">
      <div class="modal-head"><h3>Contact seller</h3><button class="close-btn" data-close>&times;</button></div>
      <div class="modal-body" id="contactBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="icons.js"></script>
<script>
// ── Config (same as app.js) ──
const sbMarket = window.supabase.createClient(
  "https://axoaujikwxgeodpmwjid.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4b2F1amlrd3hnZW9kcG13amlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MzA1NTAsImV4cCI6MjEwMDUwNjU1MH0.fiJNgBWmL23J3MtFgNbpWhJxB1PqdkkHDyGr2lD_seI"
);
const MARKET_BUCKET = "market-images";

let allListings = [];
let activeMarketCategory = "all";
let chosenMarketImage = null;

const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);

function showToast(msg, type="success"){
  const t=$('#toast'); t.textContent=msg; t.className='toast '+type; t.style.display='block';
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.style.display='none',3200);
}
function openModal(id){ $(id).classList.remove('hidden'); }
function closeModal(id){ $(id).classList.add('hidden'); }
function escapeHTML(str){ const d=document.createElement('div'); d.textContent=str??''; return d.innerHTML; }

// ── Theme ──
const themeToggle = $('#themeToggle');
function applyTheme(t){ document.body.setAttribute('data-theme',t); localStorage.setItem('yaza-theme',t); }
applyTheme(localStorage.getItem('yaza-theme')||'dark');
themeToggle.addEventListener('click',()=>applyTheme(document.body.getAttribute('data-theme')==='dark'?'light':'dark'));

// ── Back button ──
$('#backBtn').addEventListener('click', () => history.length > 1 ? history.back() : window.location.href = 'index.html');

// ── Modals ──
$$('[data-close]').forEach(btn => btn.addEventListener('click', e => e.target.closest('.modal-overlay').classList.add('hidden')));
$$('.modal-overlay').forEach(ov => ov.addEventListener('click', e => { if(e.target===ov) ov.classList.add('hidden'); }));

// ── Category chips (first set only — second set is visual duplicate) ──
const firstChips = document.querySelectorAll('#mpCatTrack .chip:nth-child(-n+7)');
firstChips.forEach(chip => {
  chip.addEventListener('click', () => {
    firstChips.forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeMarketCategory = chip.dataset.mcat;
    renderListings();
  });
});

// ── Search ──
let searchT;
$('#mpSearch').addEventListener('input', () => { clearTimeout(searchT); searchT=setTimeout(renderListings,150); });

// ── Fetch ──
async function fetchListings(){
  const { data, error } = await sbMarket.from('market_listings').select('*').order('created_at',{ascending:false});
  if(error){ $('#mpFeed').innerHTML=`<div class="empty-state"><h3>Couldn't load marketplace</h3><p>Check your connection.</p></div>`; return; }
  allListings = data || [];
  $('#mpCount').textContent = allListings.length + ' items';
  renderListings();
}

const MARKET_THUMB_ICON = {
  "Books":ICON("bookOpen",{size:28}),"Electronics":ICON("zap",{size:28}),"Uniform & Scrubs":ICON("shirt",{size:28}),"Room & Living":ICON("bed",{size:28}),"Services":ICON("tool",{size:28}),"Other":ICON("shoppingBag",{size:28})
};

function listingCardHTML(l){
  const cat = l.category || 'Other';
  const thumb = l.image_url
    ? `<img class="res-thumb-img" src="${escapeHTML(l.image_url)}" alt="" loading="lazy">`
    : `<span class="res-thumb-glyph">${MARKET_THUMB_ICON[cat]||ICON('shoppingBag',{size:28})}</span>`;
  return `
    <div class="res-card" data-mcat="${escapeHTML(cat)}" id="listing-${l.id}">
      <div class="res-card-top">
        <span class="res-cat-label">${escapeHTML(cat)}</span>
        ${l.price ? `<span class="badge" style="background:rgba(47,174,107,.15);color:var(--success)">MWK ${Number(l.price).toLocaleString()}</span>` : `<span class="badge" style="background:rgba(47,174,107,.15);color:var(--success)">Ask price</span>`}
      </div>
      <div class="res-thumb">${thumb}</div>
      <div class="res-title" style="padding:9px 12px 0;">${escapeHTML(l.title)}</div>
      <div class="res-meta" style="padding:0 12px;margin-top:6px;">
        ${l.description ? `<span>${escapeHTML(l.description)}</span>` : ''}
        <span>Seller: ${escapeHTML(l.seller_name||'Anonymous')}</span>
      </div>
      <div class="res-card-footer" style="padding:6px 12px 4px;">
        <span class="res-views"><svg class="ui-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg> ${l.views||0} view${l.views===1?'':'s'}</span>
      </div>
      <button class="card-download-btn-full" id="contact-${l.id}"><svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg> Contact Seller</button>
    </div>`;
}

function renderListings(){
  const term = $('#mpSearch').value.trim().toLowerCase();
  const filtered = allListings.filter(l => {
    const matchTerm = !term || l.title.toLowerCase().includes(term) || (l.description||'').toLowerCase().includes(term);
    const matchCat  = activeMarketCategory==='all' || l.category===activeMarketCategory;
    return matchTerm && matchCat;
  });
  if(!filtered.length){
    $('#mpFeed').innerHTML=`<div class="empty-state" style="grid-column:1/-1;"><h3>Nothing listed yet</h3><p>Be the first to sell something!</p></div>`;
    return;
  }
  $('#mpFeed').innerHTML = filtered.map(listingCardHTML).join('');
  filtered.forEach(l => {
    const btn = document.getElementById('contact-'+l.id);
    if(btn) btn.addEventListener('click', e => { e.stopPropagation(); openContact(l); });
    const card = document.getElementById('listing-'+l.id);
    if(card) card.addEventListener('click', () => openContact(l));
  });
}

function openContact(l){
  const phoneDigits = (l.seller_phone||'').replace(/[^\d+]/g,'');
  $('#contactBody').innerHTML = `
    <div class="contact-row">
      <p style="margin:0 0 12px;color:var(--text-muted);font-size:.9rem;">${escapeHTML(l.title)}${l.price ? ' · MWK '+Number(l.price).toLocaleString() : ''}</p>
      ${phoneDigits
        ? `<a class="contact-whatsapp" href="https://wa.me/${phoneDigits.replace(/^0/,'265')}" target="_blank"><svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg> Message on WhatsApp</a>
           <a class="contact-call" href="tel:${phoneDigits}" style="display:block;margin-top:8px;text-align:center;padding:12px;background:var(--navy-card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-weight:600;text-decoration:none;"><svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 2.9a2 2 0 0 1-.5 2.1L7.9 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.5 2.9.6a2 2 0 0 1 1.8 2.1Z"/></svg> Call ${escapeHTML(l.seller_phone)}</a>`
        : `<p>No contact details were provided for this listing.</p>`}
    </div>`;
  openModal('#contactModal');
}

// ── Sell FAB ──
$('#sellFab').addEventListener('click', () => { resetMarketForm(); openModal('#marketModal'); });

function resetMarketForm(){
  chosenMarketImage=null;
  $('#marketImgPreview').classList.add('hidden');
  $('#marketImgPreview').src='';
  $('#mTitle').value=''; $('#mPrice').value='';
  $('#mCategory').value='Books'; $('#mDesc').value='';
  $('#mSellerName').value=''; $('#mSellerPhone').value='';
}

$('#marketDropZone').addEventListener('click', () => $('#marketImageInput').click());
$('#marketImageInput').addEventListener('change', () => {
  const file=$('#marketImageInput').files[0]; if(!file) return;
  chosenMarketImage=file;
  const reader=new FileReader();
  reader.onload=e=>{ $('#marketImgPreview').src=e.target.result; $('#marketImgPreview').classList.remove('hidden'); };
  reader.readAsDataURL(file);
});

$('#marketPublishBtn').addEventListener('click', async () => {
  const title=$('#mTitle').value.trim();
  const price=$('#mPrice').value;
  const category=$('#mCategory').value;
  const description=$('#mDesc').value.trim();
  const seller_name=$('#mSellerName').value.trim();
  const seller_phone=$('#mSellerPhone').value.trim();
  if(!title) return showToast('Please add a title','error');
  if(!seller_phone) return showToast('Please add a contact number','error');
  const btn=$('#marketPublishBtn'); btn.disabled=true;
  try{
    let image_url=null;
    if(chosenMarketImage){
      const ext=chosenMarketImage.name.split('.').pop();
      const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const {error:ue}=await sbMarket.storage.from(MARKET_BUCKET).upload(path,chosenMarketImage,{cacheControl:'3600',upsert:false});
      if(ue) throw ue;
      const {data:pu}=sbMarket.storage.from(MARKET_BUCKET).getPublicUrl(path);
      image_url=pu.publicUrl;
    }
    const {error}=await sbMarket.from('market_listings').insert([{title,price:price?Number(price):null,category,description,seller_name,seller_phone,image_url}]);
    if(error) throw error;
    showToast('Item listed on the marketplace!');
    closeModal('#marketModal');
    fetchListings();
  } catch(err){ showToast('Couldn\'t list item: '+err.message,'error'); }
  finally{ btn.disabled=false; }
});

fetchListings();

// Arrived from the homepage's "Sell on Marketplace" shortcut?
if (new URLSearchParams(window.location.search).get('sell') === '1') {
  resetMarketForm();
  openModal('#marketModal');
}
</script>
</body>
</html>
