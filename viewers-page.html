<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Community Viewers — KUHeS Yaza</title>
<meta name="theme-color" content="#0a1f44">
<link rel="icon" href="kuhes.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.page-topbar{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--navy-deep) 88%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
}
.back-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:var(--navy-card);color:var(--text);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.back-btn:hover{border-color:var(--gold);}
.page-title{font-family:var(--font-display);font-weight:700;font-size:1.05rem;flex:1;}
.page-title em{color:var(--gold);font-style:normal;}
.page-container{padding:16px;max-width:720px;margin:0 auto;padding-bottom:40px;}

.viewer-count{font-size:.82rem;color:var(--text-muted);margin-bottom:14px;}

.team-list{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;
}
.team-card{
  display:flex;flex-direction:column;align-items:stretch;
  background:var(--navy-card);border:1px solid var(--border);border-radius:18px;padding:0;
  overflow:hidden;transition:border-color .15s ease;
}
.team-card:hover{border-color:var(--gold);}
.team-avatar{
  width:100%;aspect-ratio:1/1;height:auto;border-radius:0;overflow:hidden;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));
  display:flex;align-items:center;justify-content:center;position:relative;
}
.team-avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.avatar-fallback{
  font-family:var(--font-display);font-weight:800;font-size:2.6rem;color:#20140a;
  position:relative;z-index:1;display:none;
}
.team-info{padding:10px 12px 14px;text-align:center;}
.team-info h4{font-family:var(--font-display);font-size:.88rem;font-weight:700;color:var(--text);margin:0 0 2px;}
.team-role{font-size:.68rem;color:var(--gold);font-weight:600;display:block;}

.viewer-form-card{
  background:var(--navy-card);border:1px dashed var(--border);border-radius:16px;padding:16px;
  margin-top:14px;
}
.pick-tile{
  width:100%;display:flex;align-items:center;gap:14px;
  background:var(--navy-card);border:1px solid var(--border);border-radius:14px;
  padding:14px;cursor:pointer;text-align:left;color:var(--text);
  transition:border-color .15s ease;margin-top:14px;
}
.pick-tile:hover{border-color:var(--gold);}
.pick-icon{font-size:1.5rem;flex-shrink:0;}
.pick-tile strong{display:block;font-weight:600;font-size:.88rem;margin-bottom:2px;}
.pick-tile p{font-size:.78rem;color:var(--text-muted);margin:0;}

.drop-zone{
  background:var(--navy-card-2);border:2px dashed var(--border);border-radius:14px;
  padding:16px;text-align:center;cursor:pointer;transition:border-color .15s ease;
  position:relative;overflow:hidden;
}
.drop-zone.small{padding:12px;}
.drop-zone:hover{border-color:var(--gold);}
.drop-zone p{margin:0;font-size:.82rem;color:var(--text-muted);}
.drop-zone img{max-height:120px;object-fit:cover;border-radius:10px;width:100%;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
.field input{
  width:100%;background:var(--navy-card-2);border:1.5px solid var(--border);border-radius:12px;
  padding:12px 14px;color:var(--text);font-size:.9rem;font-family:var(--font-body);outline:none;
  transition:border-color .15s ease;
}
.field input:focus{border-color:var(--gold);}

.primary-btn{
  width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-deep));
  color:#20140a;border:none;border-radius:14px;padding:14px;
  font-weight:700;font-size:.95rem;cursor:pointer;
  transition:filter .15s ease;margin-top:4px;
}
.primary-btn:hover{filter:brightness(1.06);}
.primary-btn:disabled{opacity:.5;cursor:not-allowed;}
</style>
</head>
<body data-theme="dark">
<div id="app">

  <!-- Top bar -->
  <header class="page-topbar">
    <button class="back-btn" id="backBtn" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <div class="page-title">🌟 Community <em>Viewers</em></div>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="page-container">

    <p style="font-size:.82rem;color:var(--text-muted);margin-bottom:4px;">Students and supporters who've asked to be featured here. Anyone can add themselves below — there's no admin approval queue, just keep it respectful.</p>
    <div class="viewer-count" id="viewerCount"></div>

    <div class="team-list" id="viewersList">
      <p style="color:var(--text-muted);font-size:.85rem;">Loading…</p>
    </div>

    <button class="pick-tile" id="openViewerFormBtn">
      <span class="pick-icon">🙋</span>
      <div><strong>Add yourself as a Viewer</strong><p>Share your name and a photo</p></div>
    </button>

    <div id="viewerFormBox" class="hidden viewer-form-card">
      <div class="drop-zone small" id="viewerDropZone">
        <p>Add your photo <span class="muted-text">(optional)</span></p>
        <input type="file" id="viewerPhotoInput" accept="image/*" hidden>
        <img id="viewerPhotoPreview" class="hidden" alt="preview">
      </div>
      <div class="field" style="margin-top:12px;">
        <label>Your name</label>
        <input type="text" id="viewerName" placeholder="e.g. Chisomo B.">
      </div>
      <button id="viewerSubmitBtn" class="primary-btn">Add me</button>
    </div>

  </div>

  <div id="toast" class="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const sbMarket = window.supabase.createClient(
  "https://axoaujikwxgeodpmwjid.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4b2F1amlrd3hnZW9kcG13amlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MzA1NTAsImV4cCI6MjEwMDUwNjU1MH0.fiJNgBWmL23J3MtFgNbpWhJxB1PqdkkHDyGr2lD_seI"
);
const VIEWER_BUCKET = "viewer-photos";

const $ = sel => document.querySelector(sel);
function showToast(msg,type="success"){const t=$('#toast');t.textContent=msg;t.className='toast '+type;t.style.display='block';clearTimeout(showToast._t);showToast._t=setTimeout(()=>t.style.display='none',3200);}
function escapeHTML(str){const d=document.createElement('div');d.textContent=str??'';return d.innerHTML;}

// Theme
const themeToggle=$('#themeToggle');
function applyTheme(t){document.body.setAttribute('data-theme',t);localStorage.setItem('yaza-theme',t);}
applyTheme(localStorage.getItem('yaza-theme')||'dark');
themeToggle.addEventListener('click',()=>applyTheme(document.body.getAttribute('data-theme')==='dark'?'light':'dark'));

// Back
$('#backBtn').addEventListener('click',()=>history.length>1?history.back():window.location.href='about-page.html');

// Viewers
async function fetchViewers(){
  const list=$('#viewersList'); if(!list) return;
  const {data,error}=await sbMarket.from('viewers').select('*').order('created_at',{ascending:false});
  if(error){list.innerHTML=`<p style="color:var(--text-muted);font-size:.85rem;">Couldn't load viewers right now.</p>`;return;}
  const viewers=data||[];
  $('#viewerCount').textContent = viewers.length ? `${viewers.length} viewer${viewers.length===1?'':'s'} featured` : '';
  if(!viewers.length){list.innerHTML=`<p style="color:var(--text-muted);font-size:.85rem;">No one has added themselves yet — be the first!</p>`;return;}
  list.innerHTML=viewers.map(v=>{
    const initials=(v.name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    return `<div class="team-card viewer-card">
      <div class="team-avatar">
        ${v.photo_url?`<img src="${v.photo_url}" alt="${escapeHTML(v.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}
        <span class="avatar-fallback" style="display:${v.photo_url?'none':'flex'}">${escapeHTML(initials)}</span>
      </div>
      <div class="team-info">
        <h4>${escapeHTML(v.name)}</h4>
        <span class="team-role">Community Viewer</span>
      </div>
    </div>`;
  }).join('');
}

$('#openViewerFormBtn').addEventListener('click',()=>$('#viewerFormBox').classList.toggle('hidden'));

let chosenViewerPhoto=null;
$('#viewerDropZone').addEventListener('click',()=>$('#viewerPhotoInput').click());
$('#viewerPhotoInput').addEventListener('change',()=>{
  const file=$('#viewerPhotoInput').files[0]; if(!file) return;
  chosenViewerPhoto=file;
  const reader=new FileReader();
  reader.onload=e=>{$('#viewerPhotoPreview').src=e.target.result;$('#viewerPhotoPreview').classList.remove('hidden');};
  reader.readAsDataURL(file);
});

$('#viewerSubmitBtn').addEventListener('click',async()=>{
  const name=$('#viewerName').value.trim();
  if(!name) return showToast('Please add your name','error');
  const btn=$('#viewerSubmitBtn'); btn.disabled=true;
  try{
    let photo_url=null;
    if(chosenViewerPhoto){
      const ext=chosenViewerPhoto.name.split('.').pop();
      const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const {error:ue}=await sbMarket.storage.from(VIEWER_BUCKET).upload(path,chosenViewerPhoto,{cacheControl:'3600',upsert:false});
      if(ue) throw ue;
      const {data:pu}=sbMarket.storage.from(VIEWER_BUCKET).getPublicUrl(path);
      photo_url=pu.publicUrl;
    }
    const {error}=await sbMarket.from('viewers').insert([{name,photo_url}]);
    if(error) throw error;
    showToast("You've been added — thanks!");
    $('#viewerName').value=''; chosenViewerPhoto=null;
    $('#viewerPhotoPreview').classList.add('hidden'); $('#viewerPhotoPreview').src='';
    $('#viewerFormBox').classList.add('hidden');
    fetchViewers();
  } catch(err){ showToast("Couldn't add you: "+err.message,'error'); }
  finally{ btn.disabled=false; }
});

fetchViewers();
</script>
</body>
</html>
